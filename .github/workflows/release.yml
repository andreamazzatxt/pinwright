name: Release

# A version tag (v0.3.10) publishes that version to npm and makes its GitHub release.
# npm trusts this workflow (Trusted Publishing, set on npmjs.com): no token, and the package carries provenance.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - name: The tag is the version in package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, package.json $v"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Publish to npm
        run: |
          v=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "pinwright@$v" version 2>/dev/null)" ]; then echo "$v is already on npm"; else npm publish --access public --provenance; fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          # The commits since the previous tag; the first release, only its own.
          if [ -n "$prev" ]; then range="$prev..$GITHUB_REF_NAME"; else range="-1 $GITHUB_REF_NAME"; fi
          { git log --no-merges --format='- %s' $range | grep -v -E '^- [0-9]+\.[0-9]+\.[0-9]+$' || true
            echo
            echo "npm: https://www.npmjs.com/package/pinwright/v/${GITHUB_REF_NAME#v}"
          } > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
