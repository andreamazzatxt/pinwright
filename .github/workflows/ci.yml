name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: unit + integration (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    name: browser (Vite, Next.js, Module Federation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # No lockfile for the fixtures (exact versions in their package.json): npm writes the native builds of
      # other systems into a lockfile without a version, and then can't install from it there.
      - run: npm install --prefix test/e2e --no-audit --no-fund
      # Chrome comes with the runner image.
      - run: npm --prefix test/e2e test
